[project]
name = "mitosis-agent-framework"
version = "0.2.0"
description = "Splitting an agent into an Executor and an ethical Memory Manager to break the memory feedback loop."
readme = "README.md"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
authors = [{ name = "Ryan Chen" }]
requires-python = ">=3.10"
dependencies = ["pydantic>=2.7,<3"]

[project.optional-dependencies]
anthropic = ["anthropic>=2.3,<3"]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
