[project]
name = "mitosis-agent-framework"
version = "0.1.0"
description = "A mitosis-inspired multi-agent loop with deterministic oversight."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.7,<3"]

[project.optional-dependencies]
anthropic = ["anthropic>=2.3,<3"]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
